databaseChangeLog:
  - changeSet:
      id: V001_0_019__create_document_production_full_table
      author: adilhan
      changes:
        - createTable:
            tableName: production_full
            remarks: Таблица для хранения полной информации о производстве
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Уникальный идентификатор записи

              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: Дата документа

              - column:
                  name: document_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: Тип документа

              - column:
                  name: document_type_one_c
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: Тип документа из 1С

              - column:
                  name: number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: Номер документа

              - column:
                  name: ref_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ ссылки

              - column:
                  name: organization_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ организации

              - column:
                  name: structural_unit_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ структурной единицы

              - column:
                  name: customer_order
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ заказа клиента

              - column:
                  name: nomenclature_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ номенклатуры

              - column:
                  name: characteristic_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ характеристики

              - column:
                  name: batch_key
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: Ключ партии

              - column:
                  name: quantity
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
                  remarks: Количество

              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
                  remarks: Цена

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания записи